<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#C1502E">
<link rel="manifest" href="/manifest.webmanifest">
<title>Entrar | Duas Marias</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="entrar">
  <div class="entrar-caixa">
    <p class="marca">Duas<span>Marias</span></p>
    <h1 id="title">Entrar</h1>
    <p id="help" class="texto-apoio" hidden></p>
    <form id="form" class="formulario">
      <label class="campo"><span class="campo-rotulo">E-mail</span><input id="email" class="entrada" type="email" autocomplete="username" required maxlength="254"></label>
      <label class="campo"><span class="campo-rotulo">Senha</span><input id="password" class="entrada" type="password" autocomplete="current-password" required maxlength="128"></label>
      <label class="check"><input id="ver-senha" type="checkbox"> Mostrar senha</label>
      <button id="submit" class="btn btn-principal btn-bloco">Entrar</button>
    </form>
    <p id="message" class="campo-erro" role="alert"></p>
    <small id="esqueceu">Esqueceu a senha? Peça a alguém com acesso para redefinir em Ajustes › Contas.</small>
  </div>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
