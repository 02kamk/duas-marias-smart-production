<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#C1502E">
<link rel="manifest" href="/manifest.webmanifest">
<title>Entrar | Duas Marias</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font: 16px 'Roboto', system-ui, sans-serif; background: #FAF7F3; color: #1C1917; margin: 0; display: grid; min-height: 100vh; place-items: center; padding: 16px; box-sizing: border-box; }
  main { background: #fff; border: 1px solid #E4DAD1; padding: 32px; border-radius: 18px; width: min(400px, 100%); box-sizing: border-box; }
  .marca { font: 800 30px 'Nunito', system-ui, sans-serif; margin: 0 0 4px; color: #1C1917; }
  .marca span { color: #C1502E; }
  h2 { font: 700 20px 'Nunito', system-ui, sans-serif; margin: 20px 0 4px; }
  p { line-height: 1.6; color: #6B625C; margin: 4px 0 8px; }
  label { display: block; margin: 16px 0; font-weight: 500; color: #6B625C; font-size: 14px; }
  input, button { font: inherit; box-sizing: border-box; width: 100%; min-height: 48px; padding: 12px; border: 1px solid #E4DAD1; border-radius: 10px; margin-top: 6px; }
  input:focus-visible, button:focus-visible { outline: 3px solid #C1502E; outline-offset: 2px; }
  button { background: #C1502E; color: #fff; border: 0; cursor: pointer; font: 700 16px 'Nunito', system-ui, sans-serif; }
  button:disabled { opacity: .6; }
  #message { color: #9A3D21; min-height: 1.6em; }
  small { color: #6B625C; display: block; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <p class="marca">Duas<span>Marias</span></p>
  <h2 id="title">Entrar</h2>
  <p id="help">Inspeção de costura e gestão da produção.</p>
  <form id="form">
    <label>E-mail<input id="email" type="email" autocomplete="username" required maxlength="254"></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button id="submit">Entrar</button>
  </form>
  <p id="message" role="alert"></p>
  <small>Esqueceu a senha? Peça ao responsável pelo sistema para redefinir.</small>
</main>
<script src="/static/js/login.js"></script>
</body>
</html>
