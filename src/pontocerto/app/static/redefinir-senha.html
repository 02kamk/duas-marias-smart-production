<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#C1502E">
<meta name="referrer" content="no-referrer">
<title>Nova senha | Ponto Certo</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="entrar">
  <div class="entrar-caixa">
    <p class="marca"><svg class="marca-icone" viewBox="0 0 34 34" width="30" height="30" aria-hidden="true" focusable="false"><rect width="34" height="34" rx="10" fill="var(--terracota)"/><path d="M9 17.5l5.5 5.5L25.5 11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ponto<span>Certo</span></span></p>
    <h1>Criar senha nova</h1>
    <p class="texto-apoio">8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.</p>
    <form id="form" class="formulario">
      <label class="campo"><span class="campo-rotulo">Senha nova</span><input id="password" class="entrada" type="password" autocomplete="new-password" required maxlength="128"></label>
      <label class="campo"><span class="campo-rotulo">Repita a senha</span><input id="password2" class="entrada" type="password" autocomplete="new-password" required maxlength="128"></label>
      <label class="check"><input id="ver-senha" type="checkbox"> Mostrar senha</label>
      <button id="submit" class="btn btn-principal btn-bloco">Salvar senha</button>
    </form>
    <p id="message" class="campo-erro" role="alert"></p>
    <a id="entrar" href="/login">Voltar para entrar</a>
  </div>
</main>
<script src="/static/js/redefinir-senha.js"></script>
</body>
</html>
